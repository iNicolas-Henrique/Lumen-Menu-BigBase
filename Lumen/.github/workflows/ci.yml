name: Build Lumen DLL

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: windows-latest
    name: Build Windows x64 DLL
    steps:
      - uses: actions/checkout@v4

      - name: Check CMake version
        run: cmake --version

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Generate CMake project
        run: cmake -D CMAKE_BUILD_TYPE=RelWithDebInfo -D CMAKE_POLICY_VERSION_MINIMUM=3.5 -S. -Bbuild -G Ninja

      - name: Build 64bit release DLL
        run: cmake --build ./build --config RelWithDebInfo --target Lumen --

      - name: Check if DLL got built
        run: if (-Not (Test-Path -path "build/Lumen.dll")) {throw 1}

      - name: Stage downloadable DLL
        run: |
          New-Item -ItemType Directory -Force -Path artifact
          Copy-Item build/Lumen.dll artifact/Lumen.dll
          if (Test-Path build/Lumen.pdb) { Copy-Item build/Lumen.pdb artifact/Lumen.pdb }

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-Windows-x64-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
