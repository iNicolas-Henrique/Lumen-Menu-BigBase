name: Build latest Codex Lumen DLL

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '/build-lumen'))
    runs-on: windows-latest

    steps:
      - name: Checkout latest Codex branch
        uses: actions/checkout@v4
        with:
          ref: codex/modificar-projeto-lumen-menu-bigbase
          submodules: recursive

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S Lumen -B Lumen/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build DLL
        shell: pwsh
        run: |
          cmake --build Lumen/build --config RelWithDebInfo --parallel 2

      - name: Show produced DLL
        shell: pwsh
        run: |
          Get-ChildItem -Path Lumen/build -Recurse -Filter Lumen.dll | ForEach-Object { Write-Host $_.FullName }

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-Codex-DLL
          path: Lumen/build/**/Lumen.dll
          if-no-files-found: error
