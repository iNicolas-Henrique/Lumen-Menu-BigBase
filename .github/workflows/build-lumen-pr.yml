name: Build Tenebris DLL

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Apply Tenebris rebrand
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          $oldName = ('Lu' + 'men')
          $newName = 'Tenebris'
          $legacyWorkflow = ".github/workflows/build-$($oldName.ToLower())-pr.yml"

          if (-not (Test-Path $oldName)) {
            Write-Host "Projeto ja esta renomeado para Tenebris; nenhuma migracao necessaria."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git mv -- $oldName $newName
          if (Test-Path "$oldName.dll") {
            git rm -f -- "$oldName.dll"
          }
          git add -A

          $env:LEGACY_WORKFLOW = $legacyWorkflow
          @'
          import os
          import pathlib
          import re
          import subprocess

          old = ''.join(chr(x) for x in (76, 117, 109, 101, 110))
          new = 'Tenebris'
          legacy_workflow = os.environ['LEGACY_WORKFLOW'].replace('\\', '/')

          def replace_name(value: str) -> str:
              return value.replace(old.upper(), new.upper()).replace(old, new).replace(old.lower(), new.lower())

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode('utf-8').split('\0')
          tracked = [p for p in tracked if p]

          for src in sorted(tracked, key=lambda p: (p.count('/'), len(p)), reverse=True):
              if src.replace('\\', '/') == legacy_workflow:
                  continue
              dst = replace_name(src)
              if dst == src:
                  continue
              pathlib.Path(dst).parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(['git', 'mv', '--', src, dst], check=True)

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode('utf-8').split('\0')
          for name in (p for p in tracked if p):
              if name.replace('\\', '/') == legacy_workflow:
                  continue
              path = pathlib.Path(name)
              data = path.read_bytes()
              if b'\x00' in data:
                  continue
              try:
                  text = data.decode('utf-8')
              except UnicodeDecodeError:
                  continue
              updated = replace_name(text)
              if updated != text:
                  path.write_text(updated, encoding='utf-8', newline='')

          main_path = pathlib.Path('Tenebris/src/main.cpp')
          main_text = main_path.read_text(encoding='utf-8')
          banner = '\n'.join([
              'LOG(INFO) << R"(',
              ' _______ ______ _   _ ______ ____  _____  _____ _____',
              '|__   __|  ____| \\ | |  ____|  _ \\|  __ \\|_   _/ ____|',
              '   | |  | |__  |  \\| | |__  | |_) | |__) | | || (___',
              '   | |  |  __| | . ` |  __| |  _ <|  _  /  | | \\___ \\',
              '   | |  | |____| |\\  | |____| |_) | | \\ \\ _| |_ ____) |',
              '   |_|  |______|_| \\_|______|____/|_|  \\_\\_____|_____/',
              '                T E N E B R I S',
              ')";'
          ])
          pattern = re.compile(r'LOG\(INFO\) << R"\(\r?\n _      _.*?\r?\n\)";', re.S)
          main_text, count = pattern.subn(lambda _m: banner, main_text, count=1)
          if count != 1:
              raise SystemExit('Nao foi possivel localizar o logo antigo do console para substituir.')
          main_path.write_text(main_text, encoding='utf-8', newline='')
          '@ | python -

          git add -A

          $pathHits = @(git ls-files | Where-Object { $_ -ne $legacyWorkflow } | Select-String -Pattern $oldName -SimpleMatch -CaseSensitive:$false)
          $contentHits = @(git grep -n -i -I -- $oldName -- ':!/.github/workflows/*' 2>$null)
          if ($pathHits.Count -gt 0 -or $contentHits.Count -gt 0) {
            Write-Host "Ocorrencias residuais encontradas:"
            $pathHits | ForEach-Object { Write-Host $_ }
            $contentHits | ForEach-Object { Write-Host $_ }
            throw "A renomeacao para Tenebris ainda possui ocorrencias residuais."
          }

          if (-not (Select-String -Path "Tenebris/src/main.cpp" -Pattern "T E N E B R I S" -Quiet)) {
            throw "O logo TENEBRIS do console nao foi aplicado."
          }

          if (git status --porcelain) {
            git commit -m "refactor: rename $oldName to $newName"
            git push origin "HEAD:$env:TARGET_BRANCH"
          }

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify Tenebris rebrand
        shell: pwsh
        run: |
          $oldName = ('Lu' + 'men')
          $legacyWorkflow = ".github/workflows/build-$($oldName.ToLower())-pr.yml"
          $pathHits = @(git ls-files | Where-Object { $_ -ne $legacyWorkflow } | Select-String -Pattern $oldName -SimpleMatch -CaseSensitive:$false)
          $contentHits = @(git grep -n -i -I -- $oldName -- ':!/.github/workflows/*' 2>$null)
          if ($pathHits.Count -gt 0 -or $contentHits.Count -gt 0) {
            $pathHits | ForEach-Object { Write-Host $_ }
            $contentHits | ForEach-Object { Write-Host $_ }
            throw "Ocorrencias do nome antigo ainda existem fora do nome temporario do workflow."
          }
          if (-not (Test-Path "Tenebris")) { throw "Diretorio Tenebris ausente." }
          if (Test-Path "Tenebris.dll") { throw "DLL antiga rastreada na raiz ainda existe." }

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S Tenebris -B Tenebris/build -G Ninja "-DCMAKE_BUILD_TYPE=RelWithDebInfo" "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Verify frontend structure
        shell: pwsh
        run: |
          if (Test-Path "Tenebris/tools/verify_frontend_structure.py") {
            python Tenebris/tools/verify_frontend_structure.py
          }

      - name: Build DLL
        shell: pwsh
        run: |
          cmake --build Tenebris/build --parallel 8

      - name: Show produced DLL
        shell: pwsh
        run: |
          $dlls = @(Get-ChildItem -Path Tenebris/build -Recurse -Filter Tenebris.dll)
          if ($dlls.Count -eq 0) { throw "Tenebris.dll nao foi produzida." }
          $dlls | ForEach-Object { Write-Host $_.FullName }

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tenebris-DLL
          path: Tenebris/build/**/Tenebris.dll
          if-no-files-found: error
