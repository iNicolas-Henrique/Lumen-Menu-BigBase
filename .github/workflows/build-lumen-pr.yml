name: Build Lumen DLL (main)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: recursive

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S Lumen -B Lumen/build -G Ninja "-DCMAKE_BUILD_TYPE=RelWithDebInfo" "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"

      - name: Build DLL
        shell: pwsh
        run: |
          cmake --build Lumen/build --parallel 2

      - name: Show produced DLL
        shell: pwsh
        run: |
          Get-ChildItem -Path Lumen/build -Recurse -Filter Lumen.dll | ForEach-Object { Write-Host $_.FullName }

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-Main-DLL
          path: Lumen/build/**/Lumen.dll
          if-no-files-found: error
